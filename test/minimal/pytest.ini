[pytest]
testpaths = tests
addopts = -ra
markers =
    unit: Pure synthetic unit tests without assembler/Ghidra/pypcode dependency.
    lift: Real RISC-V assemble and p-code lifting tests.
    integration: Real assemble -> lift -> pcode_ir CFG integration tests.
    slow: Tests requiring external toolchain, Ghidra, JVM, Docker, or heavy setup.
    phase5: lift / pcode / IR semantic tests
    phase6: CFG semantic tests
    rvc: compressed RISC-V instruction tests
    rv32: RV32 compatibility tests
    atomic: atomic semantic tests
    fence: memory ordering and barrier tests
    dataflow: def-use and dependency analysis tests
    ghidra: requires Ghidra support/pythonRun and Ghidra language modules
    integration: backend integration test