[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "riscv2x86-py"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
analysis = [
    "pypcode>=2.0",
    "angr>=9.2",
    "z3-solver>=4.12",
    "pyelftools",
]

[project.scripts]
riscv2x86-py = "riscv2x86_py.cli:main"
riscv2x86-candidate-apply = "riscv2x86_py.candidate_apply_cli:main"
riscv2x86-evaluate = "riscv2x86_py.evaluation_cli:main"
riscv2x86-promote = "riscv2x86_py.writeback_promotion_cli:main"
riscv2x86-evaluation-aggregate = "riscv2x86_py.evaluation_aggregate:main"
riscv2x86-paper-evaluation = "riscv2x86_py.paper_evaluation:main"
riscv2x86-corpus-evaluate = "riscv2x86_py.corpus_evaluation_cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["riscv2x86_py*"]
