name: Phase 10 evaluation CI

on:
  push:
    branches:
      - fix-phase8-observation-schema-v2
      - fix-phase8-l0-runtime-manifest
      - fix-phase8-typed-writeback-gate
      - fix-phase8-elf-abi-hard-constraints
      - fix-phase8-real-l0-matrix-ci
      - phase8-l1-functional-differential
      - phase8-l2-operand-differential
      - phase8-l2-effect-trace-differential
      - phase8-l2-privileged-real-runner
      - phase8-l2-concurrency-memory-model
      - phase8-l3-experiment-contracts
      - phase9-validation-writeback-gate
      - phase10-staging-candidate-materialization
      - phase10-end-to-end-evaluation-runner
      - phase10-evaluation-bound-writeback
      - phase10-corpus-evaluation-metrics
      - phase10-evaluation-ci-matrix
  pull_request:

jobs:
  evaluation-contract-fixtures:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: |
          python -m pip install pytest
      - name: Run schema, staging, persistence, rejection, and negative tests
        env:
          PYTHONPATH: pytools
        run: >-
          python -m pytest -q
          pytools/tests/test_l0_build_matrix.py
          pytools/tests/test_validation_configuration.py
          pytools/tests/test_translation_validation.py
          pytools/tests/test_validation_observation.py
          pytools/tests/test_validation_status.py
          pytools/tests/test_evaluation_state_separation.py
          pytools/tests/test_translation_attempt.py
          pytools/tests/test_candidate_materialization.py
          pytools/tests/test_evaluation_runner.py
          pytools/tests/test_writeback_promotion.py
          pytools/tests/test_evaluation_aggregate.py
          pytools/tests/test_evaluation_ci_contract.py
          pytools/tests/test_paper_evaluation.py
          pytools/tests/test_validation_case.py
          pytools/tests/test_l1_differential.py
          pytools/tests/test_l2_operand_differential.py
          pytools/tests/test_l2_effect_trace_differential.py
          pytools/tests/test_l2_privileged_runner.py
          pytools/tests/test_phase8_privileged_differential_validation.py
          pytools/tests/test_l2_concurrency_runner.py
          pytools/tests/test_l3_experiment_runner.py

  real-l0-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install RV64 and x86-64 toolchains
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-riscv64-linux-gnu binutils
      - name: Run real executable L0 smoke
        env:
          PYTHONPATH: pytools
        run: python pytools/tests/run_real_l0_matrix.py --link-kind executable --matrix-profile smoke
      - name: Run real shared-library L0 smoke
        env:
          PYTHONPATH: pytools
        run: python pytools/tests/run_real_l0_matrix.py --link-kind shared_library --matrix-profile smoke

  small-real-l1:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install RV64 QEMU toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-riscv64-linux-gnu qemu-user
      - name: Run small real RV64-QEMU/x86-64 differential loop
        env:
          PYTHONPATH: pytools
        run: python pytools/tests/run_real_l1_differential.py --random-cases 4

  real-sanitizer-negatives:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Exercise real ASan and UBSan negative findings
        shell: bash
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT
          printf '#include <stdlib.h>\nint main(void){volatile int i=1;int*p=malloc(sizeof(int));p[i]=1;free(p);return 0;}\n' > "$work/asan-bad.c"
          gcc -O0 -fsanitize=address "$work/asan-bad.c" -o "$work/asan-bad"
          if ASAN_OPTIONS=halt_on_error=1 "$work/asan-bad"; then exit 1; fi
          printf '#include <limits.h>\nint main(void){volatile int x=INT_MAX;return (x+1)==0;}\n' > "$work/ubsan-bad.c"
          gcc -O0 -fsanitize=undefined "$work/ubsan-bad.c" -o "$work/ubsan-bad"
          if UBSAN_OPTIONS=halt_on_error=1 "$work/ubsan-bad"; then exit 1; fi
