name: Phase 8 controlled L3 experiments

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

concurrency:
  group: phase8-l3-controlled
  cancel-in-progress: false

jobs:
  controlled-experiment-contracts:
    if: vars.L3_CONTROLLED_RUNNER_ENABLED == 'true'
    runs-on: [self-hosted, l3-controlled]
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Validate controlled-runner configuration
        shell: bash
        env:
          TRANSLATION_ARTIFACT: ${{ vars.L3_TRANSLATION_ARTIFACT_PATH }}
          SOURCE_ARTIFACT: ${{ vars.L3_SOURCE_ARTIFACT_PATH }}
          TARGET_ARTIFACT: ${{ vars.L3_TARGET_ARTIFACT_PATH }}
          VALIDATION_PLAN: ${{ vars.L3_VALIDATION_PLAN_PATH }}
          TARGET_ENVIRONMENT: ${{ vars.L3_TARGET_ENVIRONMENT_PATH }}
          RUNTIME_REGISTRY: ${{ vars.L3_RUNTIME_REGISTRY_PATH }}
        run: |
          set -euo pipefail
          test -n "$TRANSLATION_ARTIFACT" && test -f "$TRANSLATION_ARTIFACT"
          test -n "$SOURCE_ARTIFACT" && test -f "$SOURCE_ARTIFACT"
          test -n "$TARGET_ARTIFACT" && test -f "$TARGET_ARTIFACT"
          test -n "$VALIDATION_PLAN" && test -f "$VALIDATION_PLAN"
          test -n "$TARGET_ENVIRONMENT" && test -f "$TARGET_ENVIRONMENT"
          test -n "$RUNTIME_REGISTRY" && test -f "$RUNTIME_REGISTRY"
      - name: Run versioned L0-L3 validation plan
        shell: bash
        env:
          PYTHONPATH: pytools
          TRANSLATION_ARTIFACT: ${{ vars.L3_TRANSLATION_ARTIFACT_PATH }}
          SOURCE_ARTIFACT: ${{ vars.L3_SOURCE_ARTIFACT_PATH }}
          TARGET_ARTIFACT: ${{ vars.L3_TARGET_ARTIFACT_PATH }}
          VALIDATION_PLAN: ${{ vars.L3_VALIDATION_PLAN_PATH }}
          TARGET_ENVIRONMENT: ${{ vars.L3_TARGET_ENVIRONMENT_PATH }}
          RUNTIME_REGISTRY: ${{ vars.L3_RUNTIME_REGISTRY_PATH }}
        run: |
          set -euo pipefail
          mkdir -p validation-results
          python -m riscv2x86_py.validation_cli \
            --translation-artifact "$TRANSLATION_ARTIFACT" \
            --source-program-artifact "$SOURCE_ARTIFACT" \
            --target-program-artifact "$TARGET_ARTIFACT" \
            --validation-plan "$VALIDATION_PLAN" \
            --target-environment "$TARGET_ENVIRONMENT" \
            --runtime-registry "$RUNTIME_REGISTRY" \
            --verification-output validation-results/l3-validation-result.json \
            --comparison-policy riscv2x86.comparison-policy.architectural.v1
      - name: Preserve L3 result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: l3-validation-result-${{ github.run_id }}
          path: validation-results/
          if-no-files-found: warn
          retention-days: 30
